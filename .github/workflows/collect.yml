name: Collect Travel & Hotel News

on:
  schedule:
    # 毎日 日本時間 08:00 (UTC 23:00) に自動収集・Slack通知・サイト更新
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      skip_notify:
        description: "Slack通知をスキップして記事収集・サイト更新のみ行う"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: collect-travel-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect articles, classify, summarize, and notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_NOTIFY_FILTER: ${{ vars.SLACK_NOTIFY_FILTER || 'all' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          if [ "${{ inputs.skip_notify }}" = "true" ]; then
            python scripts/collect.py --skip-notify
          else
            python scripts/collect.py
          fi

      - name: Commit updated articles.json for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/articles.json
          if git diff --cached --quiet; then
            echo "No changes in docs/data/articles.json"
          else
            git commit -m "chore(data): update collected travel news articles"
            git push
          fi
